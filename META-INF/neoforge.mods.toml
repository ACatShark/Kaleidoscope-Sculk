# 模组加载器类型（NeoForge 为 javafml）
modLoader = "javafml"
loaderVersion = "[4,)"
license = "BSD 3-Clause License"

[[mods]]
modId = "kaleidoscope_sculk"
version = "1.2"
displayName = "Kaleidoscope Sculk"
authors = ""
description = ''''''

# Mixin 配置
[[mixins]]
config = "kaleidoscope_sculk.mixins.json"

[[dependencies."kaleidoscope_sculk"]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."kaleidoscope_sculk"]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# 确保本模组注册（物品/方块/配方/标签/数据包）一定排在 tavern 之后，
# 多模组环境下即便存在同名注册项，也由 kaleidoscope_tavern 优先，不会被覆盖。
[[dependencies."kaleidoscope_sculk"]]
modId = "kaleidoscope_tavern"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
