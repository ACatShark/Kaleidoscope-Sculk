plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // 项目内仓库：提供 NeoForm 1.21.1 需要的 net.neoforged:minecraft-dependencies:1.21.1
    // （该构件未发布到任何公开仓库，这里用 MC 1.21.1 的版本清单生成了一份）
    maven {
        name = 'ProjectRepo'
        url = uri('repo')
    }
    mavenCentral()
    // Mojang 自有的库（authlib / datafixerupper / brigadier 等）
    maven {
        name = 'Minecraft Libraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// 前置模组：Kaleidoscope Tavern / Kaleidoscope Cookery（jar 放在 libs/ 目录）
// 这两个模组未在稳定的 Maven 仓库中提供，从 Modrinth 发布页下载 jar 放到 libs/ 即可：
//   Kaleidoscope Cookery  ->  https://modrinth.com/mod/kaleidoscope-cookery
//   Kaleidoscope Tavern   ->  https://modrinth.com/mod/kaleidoscopetavern
// 下面用文件名通配引用，升级时直接替换 libs/ 里的 jar（保持文件名前缀不变）即可。
dependencies {
    compileOnly fileTree(dir: 'libs', include: 'kaleidoscopecookery-*.jar')
    compileOnly fileTree(dir: 'libs', include: 'kaleidoscopetavern-*.jar')
    localRuntime fileTree(dir: 'libs', include: 'kaleidoscopecookery-*.jar')
    localRuntime fileTree(dir: 'libs', include: 'kaleidoscopetavern-*.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// 把 gradle.properties 中的变量注入到模组的元数据文件
processResources {
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_version', mod_version
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_license', mod_license
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_description', mod_description
    inputs.property 'minecraft_version_range', minecraft_version_range
    inputs.property 'neo_version_range', neo_version_range
    inputs.property 'loader_version_range', loader_version_range

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_id': mod_id,
                'mod_version': mod_version,
                'mod_name': mod_name,
                'mod_license': mod_license,
                'mod_authors': mod_authors,
                'mod_description': mod_description,
                'minecraft_version_range': minecraft_version_range,
                'neo_version_range': neo_version_range,
                'loader_version_range': loader_version_range
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}
